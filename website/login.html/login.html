<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Login form using HTML and CSS</title>
        <linK rel="stylesheet" href="styles.css">
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>

    <body>

        <div class="login-container">
        <h1 class="github-title">
            <i class="fa-brands fa-github"></i>GitHub</h1>

        <div class="wrapper">
            <form action="">
                <h1>login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="bx bx-lock"></i>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href=" #">Forgot Password?</a>
                </div>

                <button type="button" class="btn" onclick="window.location.href='https://github.com/yami-sukehirox'">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function goToPortfolio() {
            document.body.classList.add("fade-out");

            setTimeout(function() {
                window.location.href = "https://github.com/yami-sukehirox";
        }, 500);
    }
        
    </script>
   

    </body>
</html>
